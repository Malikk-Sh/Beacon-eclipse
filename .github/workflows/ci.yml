name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Upload runtime build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
